name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Check the install script parses
        run: bash -n install.sh

      - name: Check the hooks parse
        run: for f in hooks/*.sh; do bash -n "$f"; done

      - name: Check publish hygiene
        run: bun run prepublish:security

      - name: Check package contents
        run: bun pm pack --dry-run
